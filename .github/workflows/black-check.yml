name: Black Code Formatter Check

on:
  pull_request:
    branches:
      - main

jobs:
  black-check:
    name: Run Black Formatter Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Black
        run: pip install black==26.1.0

      - name: Run Black check
        run: black --check .
