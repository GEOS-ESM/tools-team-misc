    downloading: enabled
    access: public
    uri: /discover/nobackup/dao_ops/jardizzo/FLUID/EIC/data/assim/$collection
    uri_discover: /discover/nobackup/dao_ops/jardizzo/FLUID/EIC/data/assim/$collection
