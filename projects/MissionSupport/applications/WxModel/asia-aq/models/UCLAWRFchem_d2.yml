handlers: 'copy:uclad2wrf'

shift_dt: 6  
tau_start: 0
tau_end: 72
tau_inc: 1

copy:

  machine:
  login:
  password:
  remote_dir: /discover/nobackup/projects/firechem/ASIA-AQ/UCLA_forecast/%iy4%im2%id2
  local_dir: $WXMODEL_NATIVE_DIR/UCLAWRFchem_d2/Y%iy4/M%im2/D%id2/H%ih2

