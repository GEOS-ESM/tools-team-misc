  grads_latest: UCLAWRFchem_d2.latest.ddf
  dummy_file: $WXMODEL_DATA_DIR/dummy.ddf
  files: *FILENAMES

  grads_records:
      - DSET $output_dir/$output_file
      - OPTIONS template
      - TDEF time 73 linear %ih2:00z%id2%imc%iy4 1hr
