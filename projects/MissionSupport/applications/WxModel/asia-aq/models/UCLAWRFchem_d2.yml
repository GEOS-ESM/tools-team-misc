uclad2wrf:

  tau_start: 0
  tau_end: 72
  tau_inc: 1

  tasks: 4

  input_dir: $WXMODEL_NATIVE_DIR/UCLAWRFchem_d2/Y%iy4/M%im2/D%id2/H%ih2
  output_dir: $WXMODEL_DATA_DIR/UCLAWRFchem_d2/Y%iy4/M%im2/D%id2/H%ih2
