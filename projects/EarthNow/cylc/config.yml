# Default Settings
# ================

nproc: 24
base_path: /discover/nobackup/$USER/EarthNow
pngname: $base_path/images/ploteic_${model}_${product}-${region}_%Y%m%dT%H%M.png
mp4name: $base_path/movies/ploteic_${product}-${region}_$resolution.mp4
txtname: $base_path/times/timestamps_NOW_ploteic_$product-$region.txt
pngsize: 8k
frame_rate: 12
quality: 25
codec: libx264
mp4size: [8k, 4k, HD]
driver: plotall.py

# Tasks
# =====

plot_all: [plot_global, plot_conus]

plot_global:
  products: [precip, t2m, vort500, winds, wind250]
  streams: [conus2km]
  regions: [global]

plot_conus:
  products: [precip, t2m, vort500, winds, wind250]
  streams: [conus2km_lcc]
  regions: [conus]

# Product Definitions
# ===================

products:
  precip:
    product: rain_snow_accumulation_total_EarthNow
    style: light
  t2m:
    product: temperature_2m_EarthNow
    style: light
  vort500:
    product: vorticity_heights_500mb_EarthNow
    style: greytopo
  winds:
    product: winds_10m_EarthNow
    style: light
  wind250:
    product: winds_heights_250mb_EarthNow
    style: greyblue
  radar:
    product: max_reflectivity_EarthNow
    style: helicity
  cape:
    product: cape_EarthNow
    style: greyblue

# Stream Definitions
# ==================

streams:
  conus2kmfc:
    model: conus2km
    ftime: PT0H
    stime: PT0H
    etime: PT96H
    tinc: PT30M
  conus2kmrp:
    model: conus2km
    stime: -P1D
    etime: -PT30M
    tinc: PT30M
  conus2kmfc_lcc:
    model: conus2km
    ftime: PT0H
    stime: PT0H
    etime: PT96H
    tinc: PT30M
  conus2kmrp_lcc:
    model: conus2km
    stime: -P1D
    etime: -PT30M
    tinc: PT30M
  conus2km:
    model: conus2km
    streams: [conus2kmfc, conus2kmrp]
    ftime: PT0H
    stime: -P5D
    etime: PT96H
    tinc: PT30M
  conus2km_lcc:
    model: conus2km
    streams: [conus2kmfc_lcc, conus2kmrp_lcc]
    ftime: PT0H
    stime: -P5D
    etime: PT96H
    tinc: PT30M

# Resolution Definitions
# ======================

resolutions:
  8k: 7680x4320
  4k: 3840x2160
  HD: 1920x1080

# EIC Region Mapping
# ==================

regions:
  global: globe
  conus: eicusa_mapset
