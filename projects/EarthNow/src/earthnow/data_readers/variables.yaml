    hwt_15mn_slv_LCC: ICE
    hwt_30mn_slv_LCC: ICE

RAIN:
  description: "Rainfall (kg m-2 s-1)"
  collection:
    inst1_2d_asm_Nx: RAIN
    hwt_15mn_slv_LCC: RAIN
    hwt_30mn_slv_LCC: RAIN

SNOW:
