reset: [region]

region:

  global:

    long_name: Global
    lon: -180 180
    lat: -90 90
    mpdset: lowres
    mproj: scaled
    mpvals:
    barbs: 'off'
    streamlines: 'off'
    thick_above: 'off'
    thick_below: 'off'

  global-std:

    long_name: Global
    lon: -180 180
    lat: -90 90
    mpdset: lowres
    mproj: latlon
    mpvals:
    barbs: 'off'
    streamlines: 'off'
    thick_above: 'off'
    thick_below: 'off'

  eurasia:

    long_name: eurasia
    lon: 0 180
    lat: -20 70
    mpdset: newmap
    mproj: scaled
