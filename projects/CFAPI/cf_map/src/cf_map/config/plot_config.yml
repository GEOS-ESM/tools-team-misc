datagram:
  O3:
    limits: 
      min: 0.01
      max: 100
    scale:
      min: 10
      max: 111
      step: 5
    label: 'O$_3$ (PPBV)'
    contour_fmt: '%d'
    cb_fmt: '%g'
    colorbar: purple01
  NO2:
    limits:
      min: 0.01
      max: 100
    scale: [0.01, 0.02, 0.03, 0.04, 0.07, 0.1, 0.2, 0.3, 0.5, 0.8, 1.3, 2, 3.5, 5, 10, 15, 25, 40, 60, 100]
    label: 'NO$_2$ (PPBV)'
    contour_fmt: '%.2f'
    cb_fmt: '%7.2f'
    colorbar: green01
  CO:
    limits:
      min: 0.01
      max: 250
    scale:
      min: 30
      max: 256
      step: 15
    label: 'CO (PPBV)'
    contour_fmt: '%d'
    cb_fmt: '%g'
    colorbar: hot01
  SO2:
    limits:
      min: 0.01
      max: 40
    scale: [0.01, 0.02, 0.03, 0.04, 0.07, 0.1, 0.2, 0.3, 0.5, 0.8, 1.3, 2, 4, 5, 8, 10, 15, 20, 50, 100]
    label: 'SO$_2$ (PPBV)'
    contour_fmt: '%.2f'
    cb_fmt: '%7.2f'
    colorbar: Wistia
  PM25:
    limits:
      min: 0.01
      max: 150
    scale: [1, 2, 3, 5, 8, 10, 20, 25, 30, 40, 50, 60, 80, 90, 100, 150, 200, 300, 400, 500]
    label: 'PM2.5 ($\mu$g/m$^3$)'
    contour_fmt: '%d'
    cb_fmt: '%g'
    colorbar: Oranges

